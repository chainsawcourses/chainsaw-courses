        providerSubscriptionId:
          type: ["string", "null"]
        learnerId:
          type: ["integer", "null"]
        learnerEmail:
          type: ["string", "null"]
          format: email
        eventType:
          type: string
          minLength: 1
        occurredAt:
          type: string
          format: date-time
        sequence:
          type: ["integer", "null"]
        status:
          type: string
          minLength: 1
        paidThroughAt:
          type: ["string", "null"]
          format: date-time
        cancelAtPeriodEnd:
          type: ["boolean", "null"]

    SubscriptionBillingEventResult:
