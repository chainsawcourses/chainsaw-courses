        accessExpiresAt:
          type: ["string", "null"]
          format: date-time
        courseCompletedAt:
          type: ["string", "null"]
          format: date-time
        accessStatus:
          type: string
          enum: [active, expired]
        allModulesUnlocked:
          type: boolean
        assignedTo:
          type: ["string", "null"]
        id:
          type: integer
        fullName:
          type: string
        email:
          type: string
        activatedAt:
          type: string
        waiverSigned:
          type: boolean
        deviceId:
          type: string
        enrollmentId:
          type: ["integer", "null"]
        enrollmentHistory:
          type: array
          items:
            $ref: "#/components/schemas/EnrollmentSummary"
        subscription:
