          required: true
          schema:
            type: integer
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Subscription state repaired idempotently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionRepairResult"
        "404":
          description: Student or billing history was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/codes:
    post:
      operationId: createActivationCode
      tags: [admin]
      summary: Create a new activation code (for manual issuance)
      parameters:
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivationCodeInput"
      responses:
        "201":
          description: Activation code created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivationCode"

  /admin/code-reset-requests:
    get:
      operationId: listCodeResetRequests
      tags: [admin]
      summary: List learner activation-code reset requests
      parameters:
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reset requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CodeResetRequest"
        "401":
          description: Administrator authentication is required

  /admin/code-reset-requests/{requestId}/send-code:
    post:
      operationId: completeCodeResetRequest
      tags: [admin]
      summary: Email a manually-created activation code to a learner
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeResetCompletionInput"
      responses:
        "200":
          description: Code emailed and request completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Reset request not found
        "409":
          description: Request completed or code unavailable
        "502":
          description: Email delivery failed

  /news:
    get:
      operationId: listNewsItems
      tags: [news]
      summary: List all news items ordered by date
      responses:
        "200":
          description: News items list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsItem"

  /admin/news:
    post:
      operationId: createNewsItem
      tags: [news]
      summary: Create a news item
      parameters:
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNewsItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsItem"

  /admin/news/pending:
    get:
      operationId: listPendingNewsItems
      tags: [news]
      summary: List news items pending admin approval
      parameters:
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pending news items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsItem"

  /admin/news/fetch-now:
    post:
      operationId: triggerNewsFetch
      tags: [news]
      summary: Manually trigger an RSS fetch
      parameters:
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Fetch result summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsFetchResult"

  /admin/news/retag-all:
    post:
      operationId: retagAllNewsItems
      tags: [news]
      summary: Retag all approved articles that have no LO/AC assigned
      parameters:
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Retag result summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsRetagResult"

  /admin/news/{id}/approve:
    post:
      operationId: approveNewsItem
      tags: [news]
      summary: Approve a pending news item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsItem"

  /admin/news/{id}/reject:
    post:
      operationId: rejectNewsItem
      tags: [news]
      summary: Reject (delete) a pending news item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rejected

  /admin/news/{id}:
    patch:
      operationId: updateNewsItem
      tags: [news]
      summary: Update a news item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNewsItemInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsItem"
    delete:
      operationId: deleteNewsItem
      tags: [news]
      summary: Delete a news item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

components:
  securitySchemes:
    BackupTriggerBearer:
      type: http
      scheme: bearer
      description: Dedicated BACKUP_TRIGGER_SECRET; never an admin password or archive passphrase.
    WebsitePurchaseSignature:
      type: apiKey
      in: header
      name: X-CC-Signature
      description: Hex HMAC-SHA256 over timestamp + "." + exact raw JSON bytes; server-side secret only.
    WebsitePurchaseTimestamp:
      type: apiKey
      in: header
      name: X-CC-Timestamp
      description: Unix seconds within five minutes of server time.
    WebsiteBillingBearer:
      type: http
      scheme: bearer
      description: Shared website billing secret sent as an Authorization Bearer token.
    AdminToken:
      type: apiKey
      in: header
      name: admintoken
      description: Administrator session token.
  schemas:
    ApplePurchaseConfig:
      type: object
      required: [enabled, productId, environment, message]
      properties:
        enabled: { type: boolean }
        productId: { type: string }
        environment: { type: string, enum: [Sandbox, Production] }
        message: { type: string }
    AppleIntentInput:
      type: object
      required: [deviceId]
      properties:
        deviceId: { type: string, minLength: 8, maxLength: 128 }
    ApplePurchaseIntent:
      type: object
      required: [id, secret, appAccountToken, productId]
      properties:
        id: { type: string, format: uuid }
        secret: { type: string }
        appAccountToken: { type: string, format: uuid }
        productId: { type: string }
    AppleIdentityInput:
      type: object
      required: [deviceId, email, fullName]
      properties:
        deviceId: { type: string, minLength: 8, maxLength: 128 }
        email: { type: string, format: email, maxLength: 254 }
        fullName: { type: string, minLength: 2, maxLength: 160 }
    AppleIdentityChallenge:
      type: object
      required: [challengeId, message]
      properties:
        challengeId: { type: string, format: uuid }
        message: { type: string }
    AppleIdentityProof:
      type: object
      required: [challengeId, code, deviceId]
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, pattern: "^[0-9]{6}$" }
        deviceId: { type: string, minLength: 8, maxLength: 128 }
        signedTransaction: { type: string, maxLength: 32000 }
        intentId: { type: string, format: uuid }
        intentSecret: { type: string, maxLength: 128 }
    AppleTransactionInput:
      type: object
      required: [signedTransaction]
      properties:
        signedTransaction: { type: string, minLength: 100, maxLength: 32000 }
    AppleSyncResult:
      type: object
      required: [success, revoked, expiresAt]
      properties:
        success: { type: boolean }
        revoked: { type: boolean }
        expiresAt: { type: string }
    AppleNotificationInput:
      type: object
      required: [signedPayload]
      properties:
        signedPayload: { type: string, minLength: 100, maxLength: 64000 }
    AppleLearnerSession:
      type: object
      required: [activationCode, userId, enrollmentId, fullName, email, waiverRequired]
      properties:
        activationCode: { type: string }
        userId: { type: integer }
        enrollmentId: { type: integer }
        fullName: { type: string }
        email: { type: string }
        waiverRequired: { type: boolean }
    BackupTriggerStatus:
      type: object
      additionalProperties: false
      required: [state, dateKey]
      properties:
        state:
          type: string
          enum: [ready, not_due, busy, running, succeeded, failed]
        dateKey:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
    PublicRetailer:
      type: object
      additionalProperties: false
      required: [id, name, address, town, county, postcode, lat, lng, email, phone, website, featured, logoUrl]
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: string }
        town: { type: string }
        county: { type: string }
        postcode: { type: string }
        lat: { type: number }
        lng: { type: number }
        email: { type: string }
        phone: { type: string }
        website: { type: ["string", "null"] }
        featured: { type: boolean }
        logoUrl: { type: ["string", "null"], format: uri }
    RetailerLogoUploadRequest:
      type: object
      additionalProperties: false
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 5242880 }
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
    RetailerLogoUploadResponse:
      type: object
      additionalProperties: false
      required: [uploadURL, objectKey]
      properties:
        uploadURL: { type: string, format: uri }
        objectKey: { type: string, pattern: "^retailer-logos/[1-9][0-9]*/[a-f0-9-]{36}$" }
    RetailerLogoUpdateRequest:
      type: object
      additionalProperties: false
      required: [objectKey]
      properties:
        objectKey: { type: ["string", "null"], pattern: "^retailer-logos/[1-9][0-9]*/[a-f0-9-]{36}$" }
    RetailerLogoUpdateResponse:
      type: object
      additionalProperties: false
      required: [logoObjectKey]
      properties:
        logoObjectKey: { type: ["string", "null"], pattern: "^retailer-logos/[1-9][0-9]*/[a-f0-9-]{36}$" }
    WebsitePurchaseReviewSeat:
      type: object
      required: [id, orderId, lineItemId, seatId, email, status, emailStatus, isPaused, updatedAt, reviewable, resolution, resolutionNote, resolvedBy, resolvedAt]
      properties:
        id: { type: integer }
        orderId: { type: string }
        lineItemId: { type: string }
        seatId: { type: string }
        email: { type: [string, "null"] }
        status: { type: string }
        emailStatus: { type: string }
        isPaused: { type: [boolean, "null"] }
        updatedAt: { type: string }
        reviewable: { type: boolean }
        resolution: { type: [string, "null"] }
        resolutionNote: { type: [string, "null"] }
        resolvedBy: { type: [string, "null"] }
        resolvedAt: { type: [string, "null"] }
    WebsitePurchaseCode:
      type: object
      required: [code]
      properties:
        code: { type: string }
    WebsitePurchaseResolutionInput:
      type: object
      additionalProperties: false
      required: [resolution, note]
      properties:
        resolution:
          type: string
          enum: [confirmed_received, manual_handoff, closed_unresolved]
        note: { type: string, minLength: 1, maxLength: 1000 }
    WebsitePurchaseResolutionResult:
      type: object
      required: [resolved]
      properties:
        resolved: { type: boolean }
    WebsitePurchaseEvent:
      type: object
      additionalProperties: false
      required: [event, orderId, lineItemId, seatId]
      properties:
        event:
          type: string
          enum: [purchase.confirmed, purchase.refunded, purchase.cancelled]
        orderId:
          type: string
          pattern: '^[1-9]\d{0,19}$'
          description: Numeric Shopify REST order ID as a string, not order number.
        lineItemId:
          type: string
          pattern: '^[1-9]\d{0,19}$'
          description: Numeric Shopify REST line-item ID as a string.
        seatId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-zA-Z0-9:/_-]+$'
        email:
          type: string
          format: email
          maxLength: 254
          description: Required when event is purchase.confirmed.
        buyerName:
          type: string
          maxLength: 150
    WebsitePurchaseResult:
      type: object
      required: [status, emailStatus]
      properties:
        status:
          type: string
          enum: [active, revoked]
        emailStatus:
          type: string
          enum: [pending, sending, sent, needs_review, not_applicable]

    AssessmentMediaUploadInput:
      type: object
      required: [kind, name, size, contentType]
      properties:
        kind:
          type: string
          enum: [image, audio]
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
          maximum: 20971520
        contentType:
          type: string
          minLength: 1

    AssessmentMediaUploadResult:
      type: object
      required: [uploadURL, url]
      properties:
        uploadURL:
          type: string
          format: uri
        url:
          type: string

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success]

    CodeResetRequestInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320

    CodeResetCompletionInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100

    CodeResetRequest:
      type: object
      required: [id, email, status, supportEmailStatus, issuedCode, requestedAt, completedAt]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        status:
          type: string
          enum: [pending, completed]
        supportEmailStatus:
          type: string
          enum: [pending, sent, failed]
        issuedCode:
          type: ["string", "null"]
        requestedAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time

    HazardReferenceEntry:
      type: object
      required: [label, likelihood, severity, controlMeasures]
      properties:
        label:
          type: string
        likelihood:
          type: integer
          minimum: 1
          maximum: 5
        severity:
          type: integer
          minimum: 1
          maximum: 5
        controlMeasures:
          type: string

    HazardsReference:
      type: object
      required: [title, intro, hazards]
      properties:
        title:
          type: string
        intro:
          type: string
        hazards:
          type: array
          items:
            $ref: "#/components/schemas/HazardReferenceEntry"

    ActivateInput:
      type: object
      required: [code, deviceId, fullName, email]
      properties:
        code:
          type: string
        deviceId:
          type: string
        fullName:
          type: string
        email:
          type: string

    ActivationResult:
      type: object
      required: [success, userId, fullName, email]
      properties:
        success:
          type: boolean
        userId:
          type: integer
        enrollmentId:
          type: ["integer", "null"]
        fullName:
          type: string
        email:
          type: string
        waiverRequired:
          type: boolean

    UserProfile:
      type: object
      required: [id, fullName, email, activatedAt, subscription]
