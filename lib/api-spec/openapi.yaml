openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Chainsaw Manual Training App API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Activation and user authentication
  - name: billing
    description: Website subscription entitlement events
  - name: purchases
    description: Signed server-to-server purchase fulfilment
  - name: modules
    description: Training modules and videos
  - name: progress
    description: Learning progress tracking
  - name: quizzes
    description: Module quizzes and assessments
  - name: exam
    description: Summative final examination
  - name: feedback
    description: Module feedback and ratings
  - name: waiver
    description: Digital waiver management
  - name: ai
    description: AI mock assessment
  - name: admin
    description: Admin panel operations
  - name: inspections
    description: Pre-start and pre-use chainsaw inspection checklist
  - name: risk-assessments
    description: Location-aware dynamic risk assessment tool
  - name: news
    description: Arboriculture and forestry news feed
  - name: documents
    description: Course reference documents
  - name: retailers
    description: Public chainsaw retailer directory
paths:
  /apple/config:
    get:
      operationId: getApplePurchaseConfig
      tags: [purchases]
      responses:
        "200":
          description: Store availability, never a hardcoded customer price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplePurchaseConfig"
  /apple/intent:
    post:
      operationId: createApplePurchaseIntent
      tags: [purchases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleIntentInput"
      responses:
        "200":
          description: Short-lived server-owned purchase identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplePurchaseIntent"
        "503":
          description: Apple purchases are not configured
  /apple/identity/request:
    post:
      operationId: requestAppleIdentity
      tags: [purchases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleIdentityInput"
      responses:
        "200":
          description: Verification sent without disclosing whether an account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppleIdentityChallenge"
        "429":
          description: Too many requests
        "503":
          description: Mail or Apple access unavailable
  /apple/identity/complete:
    post:
      operationId: completeAppleIdentity
      tags: [purchases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleIdentityProof"
      responses:
        "200":
          description: Verified learner session for the existing app APIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppleLearnerSession"
        "400":
          description: Invalid proof
        "401":
          description: Verification failed
        "409":
          description: Ownership conflict or support required
        "503":
          description: Service unavailable
  /apple/sync:
    post:
      operationId: syncApplePurchase
      tags: [purchases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleTransactionInput"
      responses:
        "200":
          description: Reconciled without changing another provider's entitlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppleSyncResult"
        "401":
          description: Learner authentication required
        "409":
          description: Purchase ownership conflict
  /apple/notifications:
    post:
      operationId: receiveAppleNotification
      tags: [purchases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleNotificationInput"
      responses:
        "200":
          description: Verified notification acknowledged
        "400":
          description: Invalid Apple signature or payload
        "503":
          description: Apple verification unavailable
  /automation/backups/daily:
    get:
      operationId: checkDailyBackupTrigger
      tags: [admin]
      summary: Check external backup trigger configuration without starting a backup
      security:
        - BackupTriggerBearer: []
      responses:
        "200":
          description: Trigger is configured for production
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupTriggerStatus" }
        "401":
          description: Invalid dedicated trigger key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Production backup configuration is incomplete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: triggerDailyBackup
      tags: [admin]
      summary: Run the due daily backup and wait for verified completion
      description: Dedicated server-to-server trigger only. Deduplicated by Europe/London date, never before 06:00. Returns only job state, not learner data or backup download links.
      security:
        - BackupTriggerBearer: []
      responses:
        "200":
          description: Completed, failed, already recorded, or not yet due
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupTriggerStatus" }
        "202":
          description: Another backup owns the lock or today's backup is running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupTriggerStatus" }
        "401":
          description: Invalid dedicated trigger key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Backup service unavailable or configuration incomplete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /website/purchases:
    post:
      operationId: submitWebsitePurchase
      tags: [purchases]
      summary: Record a verified Shopify seat purchase or reversal
      description: Server-to-server only. The website verifies Shopify payment first and signs timestamp + "." + exact raw JSON body with WEBSITE_PURCHASE_SECRET. Never call from a browser.
      security:
        - WebsitePurchaseSignature: []
          WebsitePurchaseTimestamp: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsitePurchaseEvent"
      responses:
        "200":
          description: Code email sent or seat revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsitePurchaseResult"
        "202":
          description: Code stored; email delivery not confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsitePurchaseResult"
        "400":
          description: Invalid event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, stale, or invalid signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Legacy order or seat identity conflict requiring manual review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Bridge secret not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /retailers/public:
    get:
      operationId: getPublicRetailers
      tags: [retailers]
      summary: Get publishable retailer details for the public map
      description: Read-only retailer data only. Returns active, verified retailers and excludes learner, verification, and administrator records.
      responses:
        "200":
          description: Active, verified retailers ordered featured first, then by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicRetailer"
        "500":
          description: Retailer directory unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /retailers/public/logos/{retailerId}/{objectId}:
    get:
      operationId: getPublicRetailerLogo
      tags: [retailers]
      summary: Get a retailer logo image
      parameters:
        - name: retailerId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: objectId
          in: path
          required: true
          schema: { type: string, pattern: "^[a-f0-9-]{36}$" }
      responses:
        "200":
          description: Public retailer logo image
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "404":
          description: Logo image not found

  /admin/retailers/{id}/logo-upload:
    post:
      operationId: createRetailerLogoUpload
      tags: [retailers]
      summary: Create a signed upload URL for a retailer logo
      security:
        - AdminToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetailerLogoUploadRequest"
      responses:
        "200":
          description: Signed upload URL and private object key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetailerLogoUploadResponse"
        "400":
          description: Unsupported image type or size
        "401":
          description: Administrator authentication is required
        "404":
          description: Retailer not found
        "503":
          description: Image storage is unavailable

  /admin/retailers/{id}/logo:
    put:
      operationId: updateRetailerLogo
      tags: [retailers]
      summary: Attach, replace, or remove a retailer logo
      security:
        - AdminToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetailerLogoUpdateRequest"
      responses:
        "200":
          description: Updated retailer logo reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetailerLogoUpdateResponse"
        "400":
          description: Invalid logo reference or uploaded image
        "401":
          description: Administrator authentication is required
        "404":
          description: Retailer or uploaded image not found
        "503":
          description: Image storage is unavailable

  /documents/hazards/reference:
    get:
      operationId: getHazardsReference
      tags: [documents]
      summary: Get the Hazards and Risks reference content for the in-app reader
      responses:
        "200":
          description: Hazards and Risks reference content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HazardsReference"
        "500":
          description: Could not load the reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /documents/manual/manifest:
    get:
      operationId: getManualManifest
      tags: [documents]
      summary: Get the protected digital manual manifest
      responses:
        "200":
          description: Manual page count
          content:
            application/json:
              schema:
                type: object
                required: [pages]
                properties:
                  pages:
                    type: integer
                    minimum: 1
        "401":
          description: Missing or invalid learner credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Learner course access has ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /documents/manual/search-index:
    get:
      operationId: getManualSearchIndex
      tags: [documents]
      summary: Get the protected digital manual search index
      responses:
        "200":
          description: Searchable manual page text
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [page, text]
                  properties:
                    page:
                      type: integer
                      minimum: 1
                    text:
                      type: string
        "401":
          description: Missing or invalid learner credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Learner course access has ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /documents/manual/pages/{filename}:
    get:
      operationId: getManualPage
      tags: [documents]
      summary: Get one protected digital manual page
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
            pattern: '^page-\d{3}\.jpg$'
      responses:
        "200":
          description: Manual page image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          description: Missing or invalid learner credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Learner course access has ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Manual page not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assessment-images/{source}/{filename}:
    get:
      operationId: getAssessmentImage
      tags: [documents]
      summary: Get one protected assessment image
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
            enum: [bundled, uploads]
        - name: filename
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9._-]+$'
      responses:
        "200":
          description: Assessment image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "401":
          description: Missing or invalid learner or administrator credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Learner course access has ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Assessment image not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assessment-images/objects/assessment-media/images/{objectId}:
    get:
      operationId: getUploadedAssessmentImage
      tags: [documents]
      summary: Get one protected assessment image from App Storage
      parameters:
        - name: objectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Assessment image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "401":
          description: Missing or invalid learner or administrator credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Learner course access has ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Assessment image not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assessment-audio/{source}/{filename}:
    get:
      operationId: getLegacyAssessmentAudio
      tags: [documents]
      summary: Get one protected legacy assessment audio file
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
            enum: [uploads]
        - name: filename
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9._-]+$'
      responses:
        "200":
          description: Assessment audio
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
            audio/ogg:
              schema:
                type: string
                format: binary
            audio/mp4:
              schema:
                type: string
                format: binary
        "401":
          description: Missing or invalid learner or administrator credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Learner course access has ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Assessment audio not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assessment-audio/objects/assessment-media/audio/{objectId}:
    get:
      operationId: getUploadedAssessmentAudio
      tags: [documents]
      summary: Get one protected assessment audio file from App Storage
      parameters:
        - name: objectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Assessment audio
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
            audio/ogg:
              schema:
                type: string
                format: binary
            audio/mp4:
              schema:
                type: string
                format: binary
        "401":
          description: Missing or invalid learner or administrator credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Learner course access has ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Assessment audio not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/mock-questions/request-media-upload:
    post:
      operationId: requestAssessmentMediaUpload
      tags: [admin]
      summary: Request an App Storage upload URL for assessment media
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentMediaUploadInput"
      responses:
        "200":
          description: Presigned upload details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentMediaUploadResult"
        "400":
          description: Unsupported media type or file size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid administrator credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Media storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/activate:
    post:
      operationId: activateCode
      tags: [auth]
      summary: Activate a Shopify purchase code and bond it to a device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateInput"
      responses:
        "200":
          description: Activation successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivationResult"
        "400":
          description: Invalid or already-used code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Code bonded to another device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /learner/code-reset-requests:
    post:
      operationId: createCodeResetRequest
      tags: [auth]
      summary: Request a replacement activation code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeResetRequestInput"
      responses:
        "201":
          description: Request recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid email address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      parameters:
        - name: deviceId
          in: header
          required: true
          schema:
            type: string
        - name: activationCode
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /billing/subscription-events:
    post:
      operationId: recordSubscriptionBillingEvent
      tags: [billing]
      summary: Record a website subscription entitlement event authenticated with a shared bearer secret
      security:
        - WebsiteBillingBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionBillingEventInput"
      responses:
        "200":
          description: Event accepted or already recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionBillingEventResult"
        "400":
          description: Invalid event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid website billing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Learner identity was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email matched multiple learners and learnerId is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/history:
    get:
      operationId: getEnrollmentHistory
      tags: [auth]
      summary: Get the learner's historical CPD enrolments and evidence
      parameters:
        - name: deviceId
          in: header
          required: true
          schema:
            type: string
        - name: activationCode
          in: header
          required: true
          schema:
            type: string
        - name: userId
          in: header
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Historical enrolments and isolated progress summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentHistory"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/delete-account:
    delete:
      operationId: deleteAccount
      tags: [auth]
      summary: GDPR right to erasure - delete account and all data
      parameters:
        - name: deviceId
          in: header
          required: true
          schema:
            type: string
        - name: activationCode
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /modules:
    get:
      operationId: listModules
      tags: [modules]
      summary: List all training modules with lock status for the current user
      parameters:
        - name: deviceId
          in: header
          required: true
          schema:
            type: string
        - name: activationCode
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Module"

  /modules/{moduleId}:
    get:
      operationId: getModule
      tags: [modules]
      summary: Get a specific module with video details
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: integer
        - name: deviceId
          in: header
          required: true
          schema:
            type: string
        - name: activationCode
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Module detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleDetail"
        "403":
          description: Module locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /progress/heartbeat:
    post:
      operationId: saveHeartbeat
      tags: [progress]
      summary: Save 30-second heartbeat with video timestamp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatInput"
      responses:
        "200":
          description: Heartbeat saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /progress/complete-video:
    post:
      operationId: completeVideo
      tags: [progress]
      summary: Mark a video as completed
      requestBody:
        required: true
        content:
