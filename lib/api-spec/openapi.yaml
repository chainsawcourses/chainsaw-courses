openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Chainsaw Manual Training App API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Activation and user authentication
  - name: modules
    description: Training modules and videos
  - name: progress
    description: Learning progress tracking
  - name: quizzes
    description: Module quizzes and assessments
  - name: exam
    description: Summative final examination
  - name: feedback
    description: Module feedback and ratings
  - name: waiver
    description: Digital waiver management
  - name: ai
    description: AI mock assessment
  - name: admin
    description: Admin panel operations
  - name: inspections
    description: Pre-start and pre-use chainsaw inspection checklist
  - name: risk-assessments
    description: Location-aware dynamic risk assessment tool
  - name: news
    description: Arboriculture and forestry news feed
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/activate:
    post:
      operationId: activateCode
      tags: [auth]
      summary: Activate a Shopify purchase code and bond it to a device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateInput"
      responses:
        "200":
          description: Activation successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivationResult"
        "400":
          description: Invalid or already-used code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Code bonded to another device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      parameters:
        - name: deviceId
          in: header
          required: true
          schema:
            type: string
        - name: activationCode
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/delete-account:
    delete:
      operationId: deleteAccount
      tags: [auth]
      summary: GDPR right to erasure - delete account and all data
      parameters:
        - name: deviceId
          in: header
          required: true
          schema:
            type: string
        - name: activationCode
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /modules:
    get:
      operationId: listModules
      tags: [modules]
      summary: List all training modules with lock status for the current user
      parameters:
        - name: deviceId
          in: header
          required: true
          schema:
            type: string
        - name: activationCode
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Module"

  /modules/{moduleId}:
    get:
      operationId: getModule
      tags: [modules]
      summary: Get a specific module with video details
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: integer
        - name: deviceId
          in: header
          required: true
          schema:
            type: string
        - name: activationCode
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Module detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleDetail"
        "403":
          description: Module locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /progress/heartbeat:
    post:
      operationId: saveHeartbeat
      tags: [progress]
      summary: Save 30-second heartbeat with video timestamp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatInput"
      responses:
        "200":
          description: Heartbeat saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /progress/complete-video:
    post:
      operationId: completeVideo
      tags: [progress]
      summary: Mark a video as completed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteVideoInput"
      responses:
        "200":
          description: Video marked complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /progress/summary:
    get:
      operationId: getProgressSummary
      tags: [progress]
      summary: Get overall training progress summary
      parameters:
        - name: deviceId
          in: header
          required: true
          schema:
            type: string
        - name: activationCode
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Progress summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"

  /quizzes/{moduleId}:
    get:
      operationId: getQuiz
      tags: [quizzes]
      summary: Get quiz questions for a module
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: integer
        - name: deviceId
          in: header
          required: true
          schema:
            type: string
        - name: activationCode
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Quiz questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"

  /quizzes/{moduleId}/submit:
    post:
      operationId: submitQuiz
      tags: [quizzes]
      summary: Submit quiz answers
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizSubmission"
      responses:
        "200":
          description: Quiz result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"

  /exam:
    get:
      operationId: getExam
      tags: [exam]
      summary: Get the 45-question randomized summative exam (available once all modules are complete)
      parameters:
        - name: deviceId
          in: header
          required: true
          schema:
            type: string
        - name: activationCode
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Exam questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exam"
        "403":
          description: Exam not yet unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /exam/submit:
    post:
      operationId: submitExam
      tags: [exam]
      summary: Submit summative exam answers (80% required to pass)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExamSubmission"
      responses:
        "200":
          description: Exam result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamResult"

  /exam/status:
    get:
      operationId: getExamStatus
      tags: [exam]
      summary: Get exam attempt history and pass status for current user
      parameters:
        - name: deviceId
          in: header
          required: true
          schema:
            type: string
        - name: activationCode
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Exam status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamStatus"

  /feedback/{moduleId}:
    post:
      operationId: submitModuleFeedback
      tags: [feedback]
      summary: Submit a rating/comment for a module
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "200":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/feedback:
    get:
      operationId: listFeedback
      tags: [admin]
      summary: List all module feedback for admin review
      parameters:
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Feedback list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedbackEntry"

  /inspections:
    post:
      operationId: submitInspection
      tags: [inspections]
      summary: Submit a completed pre-start/pre-use inspection checklist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitInspectionInput"
      responses:
        "200":
          description: Inspection recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionEntry"
    get:
      operationId: listMyInspections
      tags: [inspections]
      summary: List the current student's past inspection records
      parameters:
        - name: deviceId
          in: header
          required: true
          schema:
            type: string
        - name: activationCode
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Inspection history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InspectionEntry"

  /inspections/{id}:
    patch:
      operationId: patchInspection
      tags: [inspections]
      summary: Amend a saved inspection record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchInspectionInput"
      responses:
        "200":
          description: Inspection updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionEntry"

  /admin/inspections:
    get:
      operationId: listAllInspections
      tags: [admin]
      summary: List all submitted inspections for admin review
      parameters:
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Inspection list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InspectionEntry"

  /risk-assessments:
    post:
      operationId: submitRiskAssessment
      tags: [risk-assessments]
      summary: Submit a completed dynamic risk assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRiskAssessmentInput"
      responses:
        "200":
          description: Risk assessment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskAssessmentEntry"
    get:
      operationId: listMyRiskAssessments
      tags: [risk-assessments]
      summary: List the current student's past risk assessments
      parameters:
        - name: deviceId
          in: header
          required: true
          schema:
            type: string
        - name: activationCode
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Risk assessment history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskAssessmentEntry"

  /risk-assessments/{id}:
    patch:
      operationId: patchRiskAssessment
      tags: [risk-assessments]
      summary: Amend a saved risk assessment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchRiskAssessmentInput"
      responses:
        "200":
          description: Risk assessment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskAssessmentEntry"

  /admin/risk-assessments:
    get:
      operationId: listAllRiskAssessments
      tags: [admin]
      summary: List all submitted risk assessments for admin review
      parameters:
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Risk assessment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskAssessmentEntry"

  /waiver:
    get:
      operationId: getWaiver
      tags: [waiver]
      summary: Get waiver status for current user
      parameters:
        - name: deviceId
          in: header
          required: true
          schema:
            type: string
        - name: activationCode
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Waiver status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaiverStatus"

    post:
      operationId: signWaiver
      tags: [waiver]
      summary: Sign the digital waiver with signature data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaiverInput"
      responses:
        "200":
          description: Waiver signed and PDF created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /ai/chat:
    post:
      operationId: sendAiMessage
      tags: [ai]
      summary: Send a message to the AI avatar (RAG on chainsaw manual)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatInput"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatResponse"

  /ai/chat-history:
    get:
      operationId: getChatHistory
      tags: [ai]
      summary: Get AI chat history for current session
      parameters:
        - name: deviceId
          in: header
          required: true
          schema:
            type: string
        - name: activationCode
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chat history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/students:
    get:
      operationId: listStudents
      tags: [admin]
      summary: List all students with their progress
      parameters:
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Student list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentSummary"

  /admin/students/{studentId}:
    get:
      operationId: getStudent
      tags: [admin]
      summary: Get detailed student info including progress and waiver
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Student detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDetail"

  /admin/students/{studentId}/reset-device:
    post:
      operationId: resetDeviceBond
      tags: [admin]
      summary: Reset device bond for a student (allow login from new device)
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Device bond reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get high-level platform statistics
      parameters:
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/codes:
    post:
      operationId: createActivationCode
      tags: [admin]
      summary: Create a new activation code (for manual issuance)
      parameters:
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivationCodeInput"
      responses:
        "201":
          description: Activation code created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivationCode"

  /news:
    get:
      operationId: listNewsItems
      tags: [news]
      summary: List all news items ordered by date
      responses:
        "200":
          description: News items list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsItem"

  /admin/news:
    post:
      operationId: createNewsItem
      tags: [news]
      summary: Create a news item
      parameters:
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNewsItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsItem"

  /admin/news/pending:
    get:
      operationId: listPendingNewsItems
      tags: [news]
      summary: List news items pending admin approval
      parameters:
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pending news items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsItem"

  /admin/news/fetch-now:
    post:
      operationId: triggerNewsFetch
      tags: [news]
      summary: Manually trigger an RSS fetch
      parameters:
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Fetch result summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsFetchResult"

  /admin/news/{id}/approve:
    post:
      operationId: approveNewsItem
      tags: [news]
      summary: Approve a pending news item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsItem"

  /admin/news/{id}/reject:
    post:
      operationId: rejectNewsItem
      tags: [news]
      summary: Reject (delete) a pending news item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rejected

  /admin/news/{id}:
    patch:
      operationId: updateNewsItem
      tags: [news]
      summary: Update a news item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNewsItemInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsItem"
    delete:
      operationId: deleteNewsItem
      tags: [news]
      summary: Delete a news item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: adminToken
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success]

    ActivateInput:
      type: object
      required: [code, deviceId, fullName, email]
      properties:
        code:
          type: string
        deviceId:
          type: string
        fullName:
          type: string
        email:
          type: string

    ActivationResult:
      type: object
      required: [success, userId, fullName, email]
      properties:
        success:
          type: boolean
        userId:
          type: integer
        fullName:
          type: string
        email:
          type: string
        waiverRequired:
          type: boolean

    UserProfile:
      type: object
      required: [id, fullName, email, activatedAt]
      properties:
        id:
          type: integer
        fullName:
          type: string
        email:
          type: string
        activatedAt:
          type: string
        waiverSigned:
          type: boolean
        deviceId:
          type: string

    Module:
      type: object
      required: [id, title, description, order, isLocked, isCompleted, duration, category, contentType]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        order:
          type: integer
        category:
          type: string
        subCategory:
          type: ["string", "null"]
        contentType:
          type: string
        isLocked:
          type: boolean
        isCompleted:
          type: boolean
        quizPassed:
          type: boolean
        duration:
          type: integer
        thumbnailUrl:
          type: ["string", "null"]
        isHighRisk:
          type: boolean
        learningOutcome:
          type: ["string", "null"]
        assessmentCriteria:
          type: ["string", "null"]

    ModuleDetail:
      type: object
      required: [id, title, description, order, isLocked, isCompleted, duration, vimeoId, category, contentType]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        order:
          type: integer
        category:
          type: string
        subCategory:
          type: ["string", "null"]
        contentType:
          type: string
        isLocked:
          type: boolean
        isCompleted:
          type: boolean
        quizPassed:
          type: boolean
        duration:
          type: integer
        vimeoId:
          type: string
        pdfUrl:
          type: ["string", "null"]
        thumbnailUrl:
          type: ["string", "null"]
        isHighRisk:
          type: boolean
        lastTimestamp:
          type: ["integer", "null"]
        safetyText:
          type: ["string", "null"]
        learningOutcome:
          type: ["string", "null"]
        assessmentCriteria:
          type: ["string", "null"]

    HeartbeatInput:
      type: object
      required: [moduleId, timestamp, deviceId, activationCode]
      properties:
        moduleId:
          type: integer
        timestamp:
          type: integer
        deviceId:
          type: string
        activationCode:
          type: string

    CompleteVideoInput:
