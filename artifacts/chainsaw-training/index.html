<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Chainsaw Courses</title>
    <meta name="description" content="Chainsaw Courses — Professional chainsaw safety certification training." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Chainsaw Courses" />
    <meta property="og:description" content="Chainsaw Courses — Professional chainsaw safety certification training." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chainsaw Courses" />
    <meta name="twitter:description" content="Chainsaw Courses — Professional chainsaw safety certification training." />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#e27226" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chainsaw Courses" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root">
      <div id="startup-fallback" role="status" aria-live="polite">
        <img src="/icon-192.png" alt="" width="64" height="64" />
        <p>Loading Chainsaw Courses…</p>
      </div>
    </div>
    <style>
      #startup-fallback {
        box-sizing: border-box;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        color: #333;
        background: #fff;
        text-align: center;
        font: 600 1rem/1.5 system-ui, sans-serif;
      }
    </style>
    <script>
      window.__chainsawStartupTimer = window.setTimeout(function () {
        var fallback = document.getElementById("startup-fallback");
        if (!fallback) return;
        fallback.setAttribute("role", "alert");
        fallback.innerHTML =
          '<img src="/icon-192.png" alt="Chainsaw Courses" width="64" height="64">' +
          "<h1 style=\"margin:0;color:#e27226;font-size:1.25rem\">The app could not start</h1>" +
          "<p style=\"margin:0;max-width:22rem;font-weight:400\">Check your internet connection, install any available phone software updates, then close and reopen the app.</p>" +
          "<button type=\"button\" onclick=\"window.location.reload()\" style=\"padding:.75rem 2rem;border:0;border-radius:6px;background:#e27226;color:#fff;font:600 1rem system-ui,sans-serif\">Try again</button>";
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx?v=2"></script>
  </body>
</html>
