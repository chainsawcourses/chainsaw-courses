<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Chainsaw Courses</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    img { width: 80px; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; color: #e27226; }
    p { font-size: 1rem; color: #555; line-height: 1.6; max-width: 320px; }
    button {
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      background: #e27226;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <img src="/icon-192.png" alt="Chainsaw Courses" />
  <h1>You're offline</h1>
  <p>Connect to the internet to access your training modules, quizzes, and course materials.</p>
  <button onclick="window.location.reload()">Try again</button>
</body>
</html>
