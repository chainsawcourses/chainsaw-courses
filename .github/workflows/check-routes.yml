name: Check API Routes

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  check-routes:
    name: Route coverage & stale exemptions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release validation
        run: pnpm run check:release

      - name: Check routes against OpenAPI spec
        run: pnpm --filter @workspace/api-spec run check-routes
